name: FlowIsland Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Android build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify with unit tests and lint
        run: ./gradlew --no-daemon test lint

      - name: Build debug APK and AAB
        run: ./gradlew --no-daemon assembleDebug bundleDebug

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowisland-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error

  release:
    name: Build release APK and AAB
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # A release build is allowed to run without a signing key so developers
      # can obtain and test an unsigned release artifact. A signed Play Store
      # artifact is produced automatically when the four FLOWISLAND_* secrets
      # are configured in GitHub.
      - name: Check release signing configuration
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.FLOWISLAND_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FLOWISLAND_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLOWISLAND_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLOWISLAND_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/flowisland-release.jks"
            echo "FLOWISLAND_KEYSTORE_PATH=$RUNNER_TEMP/flowisland-release.jks" >> "$GITHUB_ENV"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. Building unsigned release APK/AAB for testing only."
          fi

      - name: Build release
        env:
          FLOWISLAND_KEYSTORE_PASSWORD: ${{ secrets.FLOWISLAND_KEYSTORE_PASSWORD }}
          FLOWISLAND_KEY_ALIAS: ${{ secrets.FLOWISLAND_KEY_ALIAS }}
          FLOWISLAND_KEY_PASSWORD: ${{ secrets.FLOWISLAND_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test lint assembleRelease bundleRelease

      - name: Upload signed release artifacts
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flowisland-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload unsigned release artifacts
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flowisland-release-unsigned-testing-only
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
